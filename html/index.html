<!DOCTYPE html>
<html lang="en">
<head>

<title>Forme</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
}

.hero{
    min-height:100vh;

    background:
    linear-gradient(
        rgba(0,0,0,0.45),
        rgba(0,0,0,0.45)

    url("https://images.unsplash.com/photo-1496747611176-843222e1e57c?q=80&w=2000");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

@media(max-width:768px){

        white-space:normal;

        line-height:1.1;

                   md:text-2xl

        <div
            class="flex
                   flex-col
                   md:flex-row
                   justify-center
                   items-center
                   gap-6">

            <a href="signup.html">
    <button
        class="bg-white text-black px-16 py-4 rounded-2xl font-semibold w-80 hover:scale-105 transition">
        Get Started
    </button>
</a>

            <a href="login.html">
    <button
        class="border
               border-white
               text-white
               px-16
               py-4
               rounded-2xl
               font-semibold
               w-80

               hover:text-black
               transition">

    </button>
</a>
        </div>

    </div>

</section>
