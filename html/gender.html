<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Select Gender</title>

<link rel="stylesheet" href="../css/gender.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="container">

    <div class="card">

        <div class="step">
            Step 1 of 4
        </div>

        <h1>
            Tell us about yourself
        </h1>

        <p>
            Select your gender to personalize recommendations.
        </p>

        <div class="gender-options">

            <div class="gender-card" data-gender="Male">
                <span>👨</span>
                <h3>Male</h3>
            </div>

            <div class="gender-card" data-gender="Female">
                <span>👩</span>
                <h3>Female</h3>
            </div>

            <div class="gender-card" data-gender="Other">
                <span>⭐</span>
                <h3>Prefer Not To Say</h3>
            </div>

        </div>

        <button id="continueBtn">

            Continue

        </button>

    </div>

</div>

<script src="../js/gender.js"></script>

</body>
</html>
