<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Skin Tone</title>

<link rel="stylesheet" href="../css/skintone.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="container">

    <div class="card">

        <div class="progress">

            <div class="progress-fill"></div>

        </div>

        <div class="step">
            Step 2 of 4
        </div>

        <h1>
            Choose Your Skin Tone
        </h1>

        <p>
            This helps us suggest colors that complement you.
        </p>

        <div class="tones">

            <div class="tone" data-tone="1" style="background:#F8E4D8"></div>

            <div class="tone" data-tone="2" style="background:#F2D2BE"></div>

            <div class="tone" data-tone="3" style="background:#E8C2A5"></div>

            <div class="tone" data-tone="4" style="background:#D9A77F"></div>

            <div class="tone" data-tone="5" style="background:#C98E62"></div>

            <div class="tone" data-tone="6" style="background:#B5744D"></div>

            <div class="tone" data-tone="7" style="background:#935D3B"></div>

            <div class="tone" data-tone="8" style="background:#74462A"></div>

            <div class="tone" data-tone="9" style="background:#5A341D"></div>

            <div class="tone" data-tone="10" style="background:#3B2214"></div>

        </div>

        <button id="continueBtn">

            Continue

        </button>

    </div>

</div>

<script src="../js/skintone.js"></script>

</body>
</html>
