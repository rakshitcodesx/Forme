<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Body Shape</title>

<link rel="stylesheet" href="../css/bodyshape.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="container">

    <div class="card">

        <div class="progress">
            <div class="progress-fill"></div>
        </div>

        <div class="step">
            Step 4 of 4
        </div>

        <h1>Select Your Body Shape</h1>

        <p>
            This helps us recommend clothing that fits and flatters your proportions.
        </p>

        <div class="shape-grid">

            <div class="shape-card" data-shape="Rectangle">
                <div class="figure rectangle"></div>
                <h3>Rectangle</h3>
            </div>

            <div class="shape-card" data-shape="Triangle">
                <div class="figure triangle"></div>
                <h3>Triangle</h3>
            </div>

            <div class="shape-card" data-shape="Inverted Triangle">
                <div class="figure inverted"></div>
                <h3>Inverted Triangle</h3>
            </div>

            <div class="shape-card" data-shape="Oval">
                <div class="figure oval"></div>
                <h3>Oval</h3>
            </div>

            <div class="shape-card" data-shape="Athletic">
                <div class="figure athletic"></div>
                <h3>Athletic</h3>
            </div>

        </div>

        <button id="finishBtn">
            Finish Setup
        </button>

    </div>

</div>

<script src="../js/bodyshape.js"></script>

</body>
</html>
